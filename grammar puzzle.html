<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Puzzle — Susun Kalimat Inggris</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1929;
    --surface2: #232236;
    --accent: #e8c547;
    --accent2: #7c6af5;
    --accent3: #4ecdc4;
    --danger: #ff6b6b;
    --success: #6bcf7f;
    --text: #fffffe;
    --text-muted: #a7a9be;
    --border: rgba(255,255,255,0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,106,245,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; left: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(232,197,71,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }
  .header-tag {
    display: inline-block;
    background: rgba(124,106,245,0.15);
    color: #b8afff;
    border: 1px solid rgba(124,106,245,0.3);
    border-radius: 99px;
    font-size: 11px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    margin-bottom: 14px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
  }
  .stat-card .val {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
    transition: transform 0.2s;
  }
  .stat-card .val.pop { animation: pop 0.3s ease; }
  .stat-card .lbl {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-card:nth-child(1) .val { color: var(--accent); }
  .stat-card:nth-child(2) .val { color: var(--accent3); }
  .stat-card:nth-child(3) .val { color: var(--accent2); }

  .progress-wrap {
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.15s ease both;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .progress-track {
    height: 5px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s 0.2s ease both;
  }
  .level-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .level-pill {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 99px;
  }
  .level-1 { background: rgba(107,207,127,0.15); color: #6bcf7f; border: 1px solid rgba(107,207,127,0.25); }
  .level-2 { background: rgba(232,197,71,0.15); color: #e8c547; border: 1px solid rgba(232,197,71,0.25); }
  .level-3 { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.25); }
  .q-number {
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'Syne', sans-serif;
  }

  .hint-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .hint-text {
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
    padding: 12px 16px;
    background: rgba(124,106,245,0.08);
    border-left: 3px solid var(--accent2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  .answer-section { margin-bottom: 20px; animation: fadeUp 0.6s 0.25s ease both; }
  .section-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .drop-zone {
    min-height: 64px;
    border: 2px dashed rgba(255,255,255,0.15);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    transition: border-color 0.2s, background 0.2s;
    background: rgba(255,255,255,0.02);
  }
  .drop-zone.has-words { border-style: solid; border-color: rgba(124,106,245,0.3); background: rgba(124,106,245,0.05); }
  .drop-zone.correct { border-color: var(--success); background: rgba(107,207,127,0.07); }
  .drop-zone.wrong { border-color: var(--danger); background: rgba(255,107,107,0.07); animation: shake 0.35s ease; }
  .drop-placeholder { font-size: 13px; color: rgba(255,255,255,0.2); font-style: italic; }

  .tile {
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s, background 0.15s, box-shadow 0.12s;
    animation: tileIn 0.2s ease both;
    border: 1px solid transparent;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile:active { transform: scale(0.95); }

  .tile-bank {
    background: var(--surface2);
    color: var(--text);
    border-color: rgba(255,255,255,0.1);
  }
  .tile-bank:hover { background: rgba(124,106,245,0.2); border-color: rgba(124,106,245,0.4); box-shadow: 0 4px 12px rgba(124,106,245,0.2); }

  .tile-answer {
    background: rgba(124,106,245,0.2);
    color: #c4bdff;
    border-color: rgba(124,106,245,0.4);
  }
  .tile-answer:hover { background: rgba(255,107,107,0.15); color: #ffaaaa; border-color: rgba(255,107,107,0.3); }

  .bank-section { margin-bottom: 24px; animation: fadeUp 0.6s 0.3s ease both; }
  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 44px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    animation: fadeUp 0.6s 0.35s ease both;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.15s;
    border: none;
    letter-spacing: 0.03em;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    color: #1a1929;
  }
  .btn-primary:hover:not(:disabled) { opacity: 0.88; }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.07); }

  .feedback {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 16px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(107,207,127,0.1); color: #6bcf7f; border: 1px solid rgba(107,207,127,0.2); }
  .feedback.bad { background: rgba(255,107,107,0.1); color: #ff8a8a; border: 1px solid rgba(255,107,107,0.2); }
  .feedback.info { background: rgba(78,205,196,0.1); color: #4ecdc4; border: 1px solid rgba(78,205,196,0.2); }

  .end-screen {
    text-align: center;
    padding: 48px 20px;
    animation: fadeUp 0.5s ease both;
  }
  .end-icon {
    font-size: 72px;
    margin-bottom: 20px;
    display: block;
    animation: bounceIn 0.6s ease both;
  }
  .end-screen h2 {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .end-screen h2 span { color: var(--accent); }
  .end-score {
    font-size: 56px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin: 20px 0 6px;
  }
  .end-screen .sub { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
  .result-bars { display: grid; gap: 10px; max-width: 360px; margin: 0 auto 32px; }
  .result-row { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 16px; background: var(--surface); border-radius: var(--radius-sm); }
  .result-row span:last-child { color: var(--accent); font-family: 'Syne', sans-serif; font-weight: 700; }

  .lives-display {
    display: flex;
    gap: 4px;
  }
  .heart {
    font-size: 16px;
    transition: opacity 0.3s, transform 0.3s;
  }
  .heart.lost { opacity: 0.2; transform: scale(0.8); }

  @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes tileIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
  @keyframes shake { 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(5px); } }
  @keyframes pop { 0%{ transform: scale(1); } 50%{ transform: scale(1.3); } 100%{ transform: scale(1); } }
  @keyframes bounceIn { 0%{ opacity:0; transform: scale(0.3); } 60%{ transform: scale(1.15); } 80%{ transform: scale(0.95); } 100%{ opacity:1; transform: scale(1); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-tag">✦ English Grammar Game</div>
    <h1>Compose <span>English </span> Sentences</h1>
    <p>Click on the words to arrange them into grammatically correct sentences.</p>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="val" id="score-val">0</div>
      <div class="lbl">Score</div>
    </div>
    <div class="stat-card">
      <div class="val" id="streak-val">0</div>
      <div class="lbl">Streak</div>
    </div>
    <div class="stat-card">
      <div class="val">
        <div class="lives-display" id="lives-display">
          <span class="heart" id="h1">♥</span>
          <span class="heart" id="h2">♥</span>
          <span class="heart" id="h3">♥</span>
        </div>
      </div>
      <div class="lbl">Life</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="q-label">Question 1 to 8</span>
      <span id="pct-label">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div id="game-area">
    <div class="question-card">
      <div class="level-row">
        <span class="level-pill" id="level-pill">Quest 1</span>
        <span class="q-number" id="q-number">Quest 1</span>
      </div>
      <div class="hint-label">Instruction</div>
      <div class="hint-text" id="hint-text">Loading...</div>
    </div>

    <div class="answer-section">
      <div class="section-label">Your sentence</div>
      <div class="drop-zone" id="drop-zone">
        <span class="drop-placeholder" id="drop-ph">Click on a word below to put it here...</span>
      </div>
    </div>

    <div class="bank-section">
      <div class="section-label">Choose a word</div>
      <div class="word-bank" id="word-bank"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">
        ✓ Cek answer
      </button>
      <button class="btn btn-ghost" onclick="resetCurrent()">
        ↺ Reset
      </button>
      <button class="btn btn-ghost" onclick="skipQuestion()">
        → Next
      </button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div id="end-area" style="display:none;"></div>
</div>

<script>
const questions = [
  {
    hint: "Simple Present — dia/perempuan selalu bangun pagi setiap hari",
    words: ["She","always","wakes","up","early","every","morning"],
    answer: ["She","always","wakes","up","early","every","morning"],
    level: 1, topic: "Simple Present"
  },
  {
    hint: "Simple Past — mereka pergi ke pantai minggu lalu",
    words: ["last","They","the","week","to","beach","went"],
    answer: ["They","went","to","the","beach","last","week"],
    level: 1, topic: "Simple Past"
  },
  {
    hint: "Present Continuous — dia sedang membaca buku sekarang",
    words: ["a","She","reading","is","now","book"],
    answer: ["She","is","reading","a","book","now"],
    level: 1, topic: "Present Continuous"
  },
  {
    hint: "Kalimat Tanya (Do/Does) — apakah kamu suka musik jazz?",
    words: ["you","jazz","Do","music","like","?"],
    answer: ["Do","you","like","jazz","music","?"],
    level: 2, topic: "Question Form"
  },
  {
    hint: "Future (will) — saya akan mengunjungi nenek saya besok",
    words: ["visit","I","tomorrow","my","will","grandmother"],
    answer: ["I","will","visit","my","grandmother","tomorrow"],
    level: 2, topic: "Future Will"
  },
  {
    hint: "Present Perfect — mereka sudah menyelesaikan tugasnya",
    words: ["finished","have","their","They","already","homework"],
    answer: ["They","have","already","finished","their","homework"],
    level: 2, topic: "Present Perfect"
  },
  {
    hint: "Kalimat Pasif — mobil itu dicuci setiap minggu oleh dia",
    words: ["every","washed","The","is","him","by","week","car"],
    answer: ["The","car","is","washed","by","him","every","week"],
    level: 3, topic: "Passive Voice"
  },
  {
    hint: "Conditional (If) — jika kamu belajar keras, kamu akan lulus ujian",
    words: ["hard","you","study","the","pass","If","will","exam","you"],
    answer: ["If","you","study","hard","you","will","pass","the","exam"],
    level: 3, topic: "Conditional"
  }
];

let current = 0;
let score = 0;
let streak = 0;
let lives = 3;
let answerWords = [];
let bankWords = [];
let checking = false;

const levelNames = { 1: "Easy", 2: "Medium", 3: "Hard" };
const levelClasses = { 1: "level-1", 2: "level-2", 3: "level-3" };

function loadQuestion() {
  if (current >= questions.length) { showEnd(); return; }
  checking = false;
  const q = questions[current];
  answerWords = [];
  bankWords = shuffle([...q.words]);

  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('q-number').textContent = 'Question ' + (current + 1);
  document.getElementById('q-label').textContent = 'Question ' + (current + 1) + ' of ' + questions.length;
  const pct = Math.round((current / questions.length) * 100);
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';

  const pill = document.getElementById('level-pill');
  pill.textContent = 'Level ' + q.level + ' — ' + levelNames[q.level];
  pill.className = 'level-pill ' + levelClasses[q.level];

  const dz = document.getElementById('drop-zone');
  dz.className = 'drop-zone';
  document.getElementById('btn-check').disabled = false;
  hideFeedback();
  renderBank();
  renderAnswer();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderBank() {
  const wb = document.getElementById('word-bank');
  wb.innerHTML = '';
  bankWords.forEach((w, i) => {
    const t = document.createElement('span');
    t.className = 'tile tile-bank';
    t.textContent = w;
    t.style.animationDelay = (i * 0.04) + 's';
    t.onclick = () => moveToAnswer(i);
    wb.appendChild(t);
  });
}

function renderAnswer() {
  const dz = document.getElementById('drop-zone');
  const ph = document.getElementById('drop-ph');
  dz.querySelectorAll('.tile').forEach(e => e.remove());
  if (answerWords.length === 0) {
    ph.style.display = '';
    dz.classList.remove('has-words');
  } else {
    ph.style.display = 'none';
    dz.classList.add('has-words');
    answerWords.forEach((w, i) => {
      const t = document.createElement('span');
      t.className = 'tile tile-answer';
      t.textContent = w;
      t.onclick = () => moveToBank(i);
      dz.appendChild(t);
    });
  }
}

function moveToAnswer(bankIdx) {
  if (checking) return;
  answerWords.push(bankWords[bankIdx]);
  bankWords.splice(bankIdx, 1);
  renderBank();
  renderAnswer();
}

function moveToBank(ansIdx) {
  if (checking) return;
  bankWords.push(answerWords[ansIdx]);
  answerWords.splice(ansIdx, 1);
  renderBank();
  renderAnswer();
}

function checkAnswer() {
  if (answerWords.length === 0) {
    showFeedback('Arrange the words first, okay?', 'info');
    return;
  }
  checking = true;
  const q = questions[current];
  const correct = q.answer.join(' ');
  const given = answerWords.join(' ');
  const dz = document.getElementById('drop-zone');

  if (given === correct) {
    dz.classList.add('correct');
    const pts = q.level * 10 + (streak * 2);
    score += pts;
    streak++;
    updateStats();
    showFeedback('✓ Correct! +' + pts + ' points. Streak: ' + streak + '  ' + (streak >= 3 ? '(Combo x' + streak + '!)' : ''), 'ok');
    document.getElementById('btn-check').disabled = true;
    setTimeout(() => { current++; loadQuestion(); }, 1800);
  } else {
    lives--;
    streak = 0;
    updateStats();
    dz.classList.add('wrong');
    document.getElementById('btn-check').disabled = true;
    if (lives <= 0) {
      showFeedback('Game Over! Answer: "' + correct + '"', 'bad');
      setTimeout(showEnd, 2200);
    } else {
      showFeedback('Not quite right. Try again! Remaining lives: ' + lives, 'bad');
      setTimeout(() => {
        dz.classList.remove('wrong');
        dz.classList.remove('has-words');
        hideFeedback();
        document.getElementById('btn-check').disabled = false;
        checking = false;
      }, 1600);
    }
  }
}

function updateStats() {
  const sv = document.getElementById('score-val');
  sv.textContent = score;
  sv.classList.remove('pop');
  void sv.offsetWidth;
  sv.classList.add('pop');

  document.getElementById('streak-val').textContent = streak;

  for (let i = 1; i <= 3; i++) {
    const h = document.getElementById('h' + i);
    if (i <= lives) h.classList.remove('lost');
    else h.classList.add('lost');
  }
}

function resetCurrent() {
  if (checking && lives > 0) return;
  const q = questions[current];
  answerWords = [];
  bankWords = shuffle([...q.words]);
  document.getElementById('drop-zone').className = 'drop-zone';
  hideFeedback();
  renderBank();
  renderAnswer();
  checking = false;
  document.getElementById('btn-check').disabled = false;
}

function skipQuestion() {
  const q = questions[current];
  showFeedback('Skipped. Answer: "' + q.answer.join(' ') + '"', 'info');
  streak = 0;
  document.getElementById('streak-val').textContent = 0;
  document.getElementById('btn-check').disabled = true;
  setTimeout(() => { current++; loadQuestion(); }, 2200);
}

function showFeedback(msg, type) {
  const fb = document.getElementById('feedback');
  fb.textContent = msg;
  fb.className = 'feedback show ' + type;
}

function hideFeedback() {
  document.getElementById('feedback').className = 'feedback';
}

function showEnd() {
  document.getElementById('game-area').style.display = 'none';
  document.querySelector('.stats-bar').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';

  const maxScore = questions.reduce((s, q) => s + q.level * 10, 0);
  const pct = Math.round((score / (maxScore + 40)) * 100);
  let grade, icon;
  if (score >= 120) { grade = 'Outstanding!'; icon = '🏆'; }
  else if (score >= 80) { grade = 'Very good!'; icon = '🌟'; }
  else if (score >= 50) { grade = 'Pretty good!'; icon = '👍'; }
  else { grade = 'Keep Practicing!'; icon = '💪'; }

  const answered = questions.filter((_, i) => i < current).length;

  document.getElementById('end-area').style.display = 'block';
  document.getElementById('end-area').innerHTML = `
    <div class="end-screen">
      <span class="end-icon">${icon}</span>
      <h2>${grade}</h2>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:16px;">You have completed the Grammar Puzzle!</p>
      <div class="end-score">${score}</div>
      <div class="sub">points of ~${maxScore + 40} maximum</div>
      <div class="result-bars">
        <div class="result-row"><span>Question answered</span><span>${answered} / ${questions.length}</span></div>
        <div class="result-row"><span>Final score</span><span>${score} pts</span></div>
        <div class="result-row"><span>Highest streak</span><span>${streak}x</span></div>
        <div class="result-row"><span>Percentage</span><span>${pct}%</span></div>
      </div>
      <button class="btn btn-primary" onclick="restartGame()" style="font-size:15px; padding:13px 32px;">
        ↺ Play Again
      </button>
    </div>
  `;
}

function restartGame() {
  current = 0; score = 0; streak = 0; lives = 3;
  updateStats();
  document.getElementById('end-area').style.display = 'none';
  document.getElementById('game-area').style.display = 'block';
  document.querySelector('.stats-bar').style.display = 'grid';
  document.querySelector('.progress-wrap').style.display = 'block';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
